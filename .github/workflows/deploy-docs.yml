name: Deploy Docs (VitePress)

on:
  push:
    branches: [ production ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build VitePress Site (External Runner Workspace)
        run: |
          mkdir -p /tmp/vp-site
          cp -R docs /tmp/vp-site/docs
          cd /tmp/vp-site
          npm init -y
          npm install -D vitepress vitepress-plugin-mermaid mermaid
          npx vitepress build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/vp-site/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
