[package]
name = "data-genie"
version = "0.4.0"
edition = "2024"
authors = ["Pujan Srivastava"]
license = "MIT"
description = "High-performance, streaming-first ETL engine in Rust"
repository = "https://github.com/pujansrt/data-genie-rs.git"
homepage = "https://pujansrt.github.io/data-genie-rs/"
documentation = "https://docs.rs/data-genie"
keywords = ["etl", "streaming", "data-pipeline", "parquet", "csv"]
categories = ["data-structures", "asynchronous", "command-line-utilities"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]
autotests = false

[lib]
name = "data_genie"
path = "src/lib.rs"

[[bin]]
name = "data-genie"
path = "src/main.rs"
required-features = ["yaml"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[example]]
name = "example"
path = "examples/example.rs"

[[example]]
name = "stress-test"
path = "tests/stress-test.rs"

[features]
default = []
full = ["xml", "yaml", "parquet", "xlsx", "s3", "http"]
cli = ["yaml", "xml"]
xml = ["dep:quick-xml"]
yaml = ["dep:serde_yaml_ng", "xml"]
parquet = ["dep:parquet", "dep:arrow", "dep:bytes"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter"]
s3 = ["dep:object_store", "dep:bytes", "dep:tokio-util"]
http = ["dep:reqwest", "dep:tokio-util", "tokio/net"]

[dependencies]
# Core minimal dependencies
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "io-util", "io-std", "fs", "sync", "time"] }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order"] }
indexmap = { version = "2.6", default-features = false, features = ["std", "serde"] }
csv = "1.3"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Optional format, YAML & cloud connectors
quick-xml = { version = "0.42", default-features = false, optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["io"], optional = true }
bytes = { version = "1.8", default-features = false, features = ["std"], optional = true }
calamine = { version = "0.38", optional = true }
rust_xlsxwriter = { version = "0.104", optional = true }
parquet = { version = "60.2", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "zstd", "lz4"], optional = true }
arrow = { version = "60.2", default-features = false, features = ["ipc", "json"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
object_store = { version = "0.14", default-features = false, features = ["aws"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
