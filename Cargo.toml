[workspace]
resolver = "3"
members = [
    ".",
    "crates/data-genie-core",
    "crates/data-genie-xml",
    "crates/data-genie-yaml",
    "crates/data-genie-parquet",
    "crates/data-genie-xlsx",
    "crates/data-genie-http",
    "crates/data-genie-s3",
    "crates/data-genie-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Pujan Srivastava"]
license = "MIT"
repository = "https://github.com/pujansrt/data-genie-rs.git"
homepage = "https://pujansrt.github.io/data-genie-rs/"

[workspace.dependencies]
# Internal workspace crates
data-genie = { version = "0.3.0", path = "." }
data-genie-core = { version = "0.3.0", path = "crates/data-genie-core" }
data-genie-xml = { version = "0.3.0", path = "crates/data-genie-xml" }
data-genie-yaml = { version = "0.3.0", path = "crates/data-genie-yaml" }
data-genie-parquet = { version = "0.3.0", path = "crates/data-genie-parquet" }
data-genie-xlsx = { version = "0.3.0", path = "crates/data-genie-xlsx" }
data-genie-http = { version = "0.3.0", path = "crates/data-genie-http" }
data-genie-s3 = { version = "0.3.0", path = "crates/data-genie-s3" }

# Core dependencies
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "io-util", "io-std", "fs", "sync", "time"] }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order"] }
indexmap = { version = "2.6", default-features = false, features = ["std", "serde"] }
csv = "1.3"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Connector dependencies
quick-xml = { version = "0.42", default-features = false }
serde_yaml_ng = "0.10"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
bytes = { version = "1.8", default-features = false, features = ["std"] }
calamine = "0.38"
rust_xlsxwriter = "0.104"
parquet = { version = "60.2", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "zstd", "lz4"] }
arrow = { version = "60.2", default-features = false, features = ["ipc", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }

[package]
name = "data-genie"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance, streaming-first ETL engine in Rust"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/data-genie"
keywords = ["etl", "streaming", "data-pipeline", "parquet", "csv"]
categories = ["data-structures", "asynchronous"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]
autotests = false

[lib]
name = "data_genie"
path = "src/lib.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[example]]
name = "example"
path = "examples/example.rs"

[[example]]
name = "stress-test"
path = "tests/stress-test.rs"

[features]
default = []
full = ["xml", "yaml", "parquet", "xlsx", "s3", "http"]
xml = ["dep:data-genie-xml"]
yaml = ["dep:data-genie-yaml"]
parquet = ["dep:data-genie-parquet"]
xlsx = ["dep:data-genie-xlsx"]
s3 = ["dep:data-genie-s3"]
http = ["dep:data-genie-http"]

[dependencies]
data-genie-core.workspace = true
data-genie-xml = { workspace = true, optional = true }
data-genie-yaml = { workspace = true, optional = true }
data-genie-parquet = { workspace = true, optional = true }
data-genie-xlsx = { workspace = true, optional = true }
data-genie-http = { workspace = true, optional = true }
data-genie-s3 = { workspace = true, optional = true }

[dev-dependencies]
async-stream.workspace = true
async-trait.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "io-util", "net", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
