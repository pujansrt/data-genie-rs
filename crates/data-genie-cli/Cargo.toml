[package]
name = "data-genie-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for running and validating data-genie ETL pipelines"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/data-genie"
keywords = ["etl", "cli", "streaming", "data-pipeline"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/Cargo.toml",
]

[[bin]]
name = "data-genie"
path = "src/main.rs"

[dependencies]
data-genie = { workspace = true, features = ["yaml", "xml"] }

[dev-dependencies]
serde_json.workspace = true
