[alias]
cov = "run --quiet --example coverage_report --"
cov-summary = "run --quiet --example coverage_report -- --summary-only"
cov-html = "run --quiet --example coverage_report -- --open"
cov-lcov = "llvm-cov --workspace --all-features --lcov --output-path lcov.info"
stress-test = "run --release --example stress-test"